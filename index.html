<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3학년 진학·학사 통합 포털</title>
    <!-- Pretendard Webfont Early Preload -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      try {
        var cachedTitle = localStorage.getItem('pcm_login_system_name');
        var cachedSchool = localStorage.getItem('pcm_school_name');
        if (cachedTitle && cachedTitle.trim()) {
          var cleanS = (cachedSchool && cachedSchool !== '우리학교') ? cachedSchool.trim() + ' - ' : '';
          document.title = cleanS + cachedTitle.trim();
        }
      } catch (e) {}
    </script>
    <!-- Start Single Page Apps for GitHub Pages. -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
              basePath + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
