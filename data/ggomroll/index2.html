<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결석계 조회 (교사용)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: #f1f3f5;
            padding: 20px;
        }

        body.modal-open {
            overflow: hidden;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #4A86E8;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* 탭 스타일 */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            color: #adb5bd;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: #4A86E8;
            border-bottom: 3px solid #4A86E8;
        }

        .search-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .search-panel {
            display: none;
        }

        .search-panel.active {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        select,
        input[type="text"] {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        select:focus,
        input[type="text"]:focus {
            border-color: #4A86E8;
        }

        .dropdown-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .dropdown-group label {
            font-weight: bold;
            color: #495057;
            font-size: 14px;
        }

        .btn-search {
            padding: 10px 25px;
            background: #4A86E8;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn-search:hover {
            background: #3b6fc3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #f8f9fa;
            color: #4A86E8;
            padding: 12px;
            border-bottom: 2px solid #dee2e6;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
        }

        tr:hover {
            background: #f1f8ff;
        }

        .btn-view {
            display: inline-block;
            width: 75px;
            padding: 6px 0;
            background-color: #adb5bd;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            box-sizing: border-box;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .btn-view:hover {
            background-color: #868e96;
        }

        .btn-print {
            display: inline-block;
            width: 55px;
            padding: 6px 0;
            background-color: #4dabf7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            box-sizing: border-box;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .btn-print:hover {
            background-color: #339af0;
        }

        .btn-recreate {
            display: inline-block;
            width: 65px;
            padding: 6px 0;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            box-sizing: border-box;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .btn-recreate:hover {
            background-color: #d35400;
        }

        .txt-nopdf {
            display: inline-block;
            width: 135px;
            /* 75px(미리보기) + 5px(gap) + 55px(출력) = 135px */
            color: #adb5bd;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .action-cell {
            display: flex !important;
            gap: 5px;
            align-items: center;
            justify-content: flex-start;
        }

        .btn-delete {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-delete:hover {
            background-color: #fa5252;
        }

        /* 모달 스타일 (index.html과 동일) */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 2vh auto;
            padding: 25px;
            border-radius: 15px;
            width: 98%;
            max-width: 800px;
            /* Reduced to 800px as requested */
            max-height: 90vh;
            /* Limit height and lift up from bottom */
            height: auto;
            /* Dynamic height based on content */
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            overflow-x: hidden;
            /* Prevent horizontal scroll */
        }

        .modal-scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            /* Absolutely no horizontal scroll */
            padding-right: 15px;
            /* Space for scrollbar */
            margin-right: -10px;
            margin-top: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4A86E8;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-modal {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        #pdfFrame {
            width: 100%;
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .no-result {
            text-align: center;
            padding: 50px;
            color: #868e96;
        }

        /* 수정 모달용 추가 스타일 */
        .edit-form-row {
            display: grid;
            gap: 15px;
            margin-bottom: 18px;
            width: 100%;
        }

        /* Row 1: 20:20:20:32 ratio with 20px fixed gap */
        .grid-row-1 {
            grid-template-columns: 20fr 20fr 20fr 32fr;
            gap: 20px;
        }

        /* Row 2 & 7: Even split with 20px gap */
        .grid-row-2,
        .grid-row-7 {
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Row 3: Dates (31fr) and Periods (16fr) with 20px gap */
        .grid-row-3 {
            grid-template-columns: 31fr 16fr 31fr 16fr;
            gap: 20px;
        }

        .edit-form-item {
            display: flex;
            flex-direction: column;
            text-align: left;
            min-width: 0;
            /* Prevent grid items from pushing past container */
        }

        .edit-form-item label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
            color: #555;
        }

        .edit-form-item input,
        .edit-form-item select,
        .edit-form-item textarea {
            width: 100% !important;
            max-width: 100% !important;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box !important;
            /* Force include padding in width */
        }

        #editForm {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        /* 첨부 서류 테이블 스타일 */
        .edit-doc-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
        }

        .edit-doc-table th {
            background: #f8f9fa;
            color: #495057;
            font-weight: 600;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
            font-size: 13px;
        }

        .edit-doc-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            color: #333 !important;
            font-size: 14px;
        }

        .edit-doc-table tr:hover {
            background-color: #f1f8ff;
        }

        .edit-doc-table tr:last-child td {
            border-bottom: none;
        }

        .edit-doc-table input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
            vertical-align: middle;
        }

        .edit-doc-table label {
            display: flex;
            align-items: center;
            width: 100%;
            cursor: pointer;
            margin: 0;
            font-weight: 500;
        }

        .edit-doc-item {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 12px;
            padding: 12px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            background: #fff;
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .edit-doc-item:hover {
            border-color: #4A86E8;
            background: #f8fbff;
        }

        .edit-doc-item input[type="checkbox"] {
            margin-top: 4px;
            flex-shrink: 0;
        }

        .edit-doc-item span {
            font-size: 14px;
            line-height: 1.4;
            color: #343a40 !important;
            /* Ensure visibility */
            flex: 1;
            font-weight: 500;
        }

        #editDocList {
            display: block !important;
            width: 100%;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #4A86E8;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        /* 스피너 정의 */
        .loading::before {
            content: "";
            width: 50px;
            height: 50px;
            border: 5px solid #e9ecef;
            border-top: 5px solid #4A86E8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🔍 결석계 기록 조회 (교사용)</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('class')">학년/반별 조회</div>
            <div class="tab" onclick="switchTab('name')">이름으로 조회</div>
        </div>

        <div class="search-container">
            <!-- 공통 월 선택 -->
            <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <div class="dropdown-group">
                    <label>조회 월</label>
                    <select id="monthSelect" onchange="autoSearch()">
                        <option value="">전체 기간</option>
                    </select>
                </div>
            </div>
            <hr style="border:0; border-top:1px solid #dee2e6; margin-bottom:15px;">

            <!-- 학년/반/번호 패널 -->
            <div id="classPanel" class="search-panel active">
                <div class="dropdown-group">
                    <label>학년</label>
                    <select id="gradeSelect" onchange="autoSearch()">
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="dropdown-group">
                    <label>반</label>
                    <select id="classSelect" onchange="autoSearch()">
                        <option value="">전체</option>
                    </select>
                </div>
                <div class="dropdown-group">
                    <label>번호</label>
                    <select id="numberSelect" onchange="autoSearch()">
                        <option value="">전체</option>
                    </select>
                </div>
                <button class="btn-search" onclick="performSearch()">조회</button>
                <button class="btn-search" style="background:#e67e22" onclick="bulkRecreate()">일괄 재생성</button>
                <button class="btn-search" style="background:#4dabf7" onclick="bulkPrint()">일괄 인쇄</button>
            </div>

            <!-- 이름 패널 -->
            <div id="namePanel" class="search-panel">
                <input type="text" id="nameInput" placeholder="학생 이름을 입력하세요" style="flex:1"
                    onkeypress="if(event.keyCode==13) performSearch()">
                <button class="btn-search" onclick="performSearch()">검색</button>
            </div>
        </div>

        <div id="loading" class="loading">조회 중입니다...</div>

        <div id="resultArea">
            <div class="no-result">검색어를 입력하고 버튼을 눌러주세요.</div>
        </div>
    </div>

    <!-- PDF 미리보기 모달 -->
    <div id="pdfModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin:0; color:#4A86E8;">📄 결석계 미리보기</h3>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <iframe id="pdfFrame" src=""></iframe>
            <div style="text-align:right; margin-top:15px; display: flex; justify-content: flex-end; gap: 10px;">
                <a id="pdfDownloadBtn" href="#" target="_blank" class="btn-print"
                    style="background:#27ae60; text-decoration: none; padding: 10px 20px; color: white;">⬇️ 다운로드</a>
                <button class="btn-view" onclick="closeModal()" style="padding: 10px 20px;">닫기</button>
            </div>
        </div>
    </div>

    <!-- 기록 수정 모달 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; color:#4A86E8;">✏️ 결석계 기록 수정</h3>
                <span class="close-modal" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editForm">
                <input type="hidden" name="rowNo" id="editRowNo">
                <div class="modal-scroll-area">
                    <!-- Row 1: 학년(22%), 반(22%), 번호(22%), 성명(34%) -->
                    <div class="edit-form-row grid-row-1">
                        <div class="edit-form-item">
                            <label>학년</label>
                            <select name="grade" id="editGrade"></select>
                        </div>
                        <div class="edit-form-item">
                            <label>반</label>
                            <select name="class" id="editClass"></select>
                        </div>
                        <div class="edit-form-item">
                            <label>번호</label>
                            <select name="number" id="editNumber"></select>
                        </div>
                        <div class="edit-form-item">
                            <label>학생 성명</label>
                            <input type="text" name="name" id="editName">
                        </div>
                    </div>

                    <!-- Row 2: 결석 구분(50%), 결석 종류(50%) -->
                    <div class="edit-form-row grid-row-2">
                        <div class="edit-form-item">
                            <label>결석 구분</label>
                            <select name="cat" id="editCat">
                                <option value="결석">결석</option>
                                <option value="지각">지각</option>
                                <option value="조퇴">조퇴</option>
                                <option value="결과">결과</option>
                            </select>
                        </div>
                        <div class="edit-form-item">
                            <label>결석 종류</label>
                            <select name="type" id="editType" onchange="updateEditUI()">
                                <option value="질병">질병</option>
                                <option value="생리통">생리통(기존호환)</option>
                                <option value="출석인정">출석인정</option>
                                <option value="기타">기타</option>
                            </select>

                            <!-- 하위 선택지 추가 -->
                            <div id="editSubTypeContainer"
                                style="display:none; margin-top:10px; padding:10px; background:#f8f9fa; border-radius:6px; border:1px solid #e9ecef;">
                                <label style="font-size:13px; color:#4A86E8; margin-bottom:8px; display:block;">세부
                                    사유</label>
                                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                                    <label style="display:flex; align-items:center; cursor:pointer;"><input type="radio"
                                            name="editSubType" value="생리통"
                                            style="width:16px!important; margin-right:4px;"
                                            onchange="updateEditUI()">생리통</label>
                                    <label style="display:flex; align-items:center; cursor:pointer;"><input type="radio"
                                            name="editSubType" value="경조사"
                                            style="width:16px!important; margin-right:4px;"
                                            onchange="updateEditUI()">경조사</label>
                                    <label style="display:flex; align-items:center; cursor:pointer;"><input type="radio"
                                            name="editSubType" value="전염병"
                                            style="width:16px!important; margin-right:4px;"
                                            onchange="updateEditUI()">전염병</label>
                                    <label style="display:flex; align-items:center; cursor:pointer;"><input type="radio"
                                            name="editSubType" value="대입 관련"
                                            style="width:16px!important; margin-right:4px;" onchange="updateEditUI()">대입
                                        관련</label>
                                    <label style="display:flex; align-items:center; cursor:pointer;"><input type="radio"
                                            name="editSubType" value="기타"
                                            style="width:16px!important; margin-right:4px;"
                                            onchange="updateEditUI()">기타</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Row 3: 시작일(35%), 시작교시(15%), 종료일(35%), 종료교시(15%) -->
                    <div class="edit-form-row grid-row-3">
                        <div class="edit-form-item">
                            <label>시작일</label>
                            <input type="date" name="startDate" id="editStartDate" onchange="calcEditDays()">
                        </div>
                        <div class="edit-form-item">
                            <label>시작 교시</label>
                            <select name="startPeriod" id="editStartPeriod">
                                <option value="1">1교시</option>
                                <option value="2">2교시</option>
                                <option value="3">3교시</option>
                                <option value="4">4교시</option>
                                <option value="5">5교시</option>
                                <option value="6">6교시</option>
                                <option value="7">7교시</option>
                            </select>
                        </div>
                        <div class="edit-form-item">
                            <label>종료일</label>
                            <input type="date" name="endDate" id="editEndDate" onchange="calcEditDays()">
                        </div>
                        <div class="edit-form-item">
                            <label>종료 교시</label>
                            <select name="endPeriod" id="editEndPeriod">
                                <option value="1">1교시</option>
                                <option value="2">2교시</option>
                                <option value="3">3교시</option>
                                <option value="4">4교시</option>
                                <option value="5">5교시</option>
                                <option value="6">6교시</option>
                                <option value="7">7교시</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 4: 총 일수(50%), 작성일(50%) -->
                    <div class="edit-form-row grid-row-2">
                        <div class="edit-form-item">
                            <label>총 일수</label>
                            <input type="text" name="totalDays" id="editTotalDays" readonly style="background:#f1f3f5">
                        </div>
                        <div class="edit-form-item">
                            <label>작성일</label>
                            <input type="date" name="writeDate" id="editWriteDate">
                        </div>
                    </div>

                    <!-- Row 5: 구체적 사유(100%) -->
                    <div class="edit-form-row">
                        <div class="edit-form-item">
                            <label>구체적 사유</label>
                            <textarea name="reason" id="editReason" rows="2"></textarea>
                        </div>
                    </div>

                    <!-- Row 6: 첨부 증빙 서류(100%) -->
                    <div class="edit-form-row" id="editDocListContainer"
                        style="border-top: 1px solid #eee; padding-top: 10px;">
                        <div class="edit-form-item">
                            <label>첨부 증빙 서류</label>
                            <div id="editDocList">
                                <!-- 동적 생성 선언 -->
                            </div>
                        </div>
                    </div>

                    <!-- Row 6.5: 담임교사 확인일(100%) -->
                    <div class="edit-form-row">
                        <div class="edit-form-item">
                            <label>담임교사 확인일 (사본 확인 등)</label>
                            <input type="date" name="confirmDate" id="editConfirmDate">
                        </div>
                    </div>

                    <!-- Row 6.6: 확인 방법(100%) -->
                    <div class="edit-form-row">
                        <div class="edit-form-item">
                            <label>확인 방법</label>
                            <div
                                style="display:flex; gap:12px; flex-wrap:wrap; padding:8px; background:#f8f9fa; border-radius:6px; border:1px solid #e9ecef;">
                                <label style="display:flex; align-items:center; cursor:pointer;"><input type="checkbox"
                                        name="m_visit" id="edit_m_visit"
                                        style="width:16px!important; margin-right:4px;">가정방문</label>
                                <label style="display:flex; align-items:center; cursor:pointer;"><input type="checkbox"
                                        name="m_phone" id="edit_m_phone"
                                        style="width:16px!important; margin-right:4px;">전화연락</label>
                                <label style="display:flex; align-items:center; cursor:pointer;"><input type="checkbox"
                                        name="m_school" id="edit_m_school"
                                        style="width:16px!important; margin-right:4px;">학부모내교</label>
                                <label style="display:flex; align-items:center; cursor:pointer;"><input type="checkbox"
                                        name="m_other" id="edit_m_other" style="width:16px!important; margin-right:4px;"
                                        onchange="toggleEditMOtherInput(this)">기타</label>
                            </div>
                            <div id="editMOtherInputDiv" style="display:none; margin-top:8px;">
                                <input type="text" name="m_other_text" id="edit_m_other_text"
                                    placeholder="방법 입력 (최대 6자)" maxlength="6"
                                    style="padding:6px 10px; font-size:13px; border:1px solid #4A86E8; border-radius:5px; width:160px; text-align:center;">
                            </div>
                        </div>
                    </div>

                    <!-- Row 7: 담임성명(50%), 담임확인일(50%) -->
                    <div class="edit-form-row grid-row-7" style="margin-top: 15px;">
                        <div class="edit-form-item">
                            <label>담임 성명</label>
                            <input type="text" name="teacherName" id="editTeacherName">
                        </div>
                        <div class="edit-form-item">
                            <label>담임 확인일</label>
                            <input type="date" name="teacherDate" id="editTeacherDate">
                        </div>
                    </div>
                </div>
                <div
                    style="text-align:right; margin-top:25px; padding-bottom: 5px; display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn-view" onclick="closeEditModal()">취소</button>
                    <button type="button" class="btn-print" onclick="saveEdit()">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentMode = 'class'; // 'class' or 'name'

        function switchTab(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.search-panel').forEach(p => p.classList.remove('active'));

            if (mode === 'class') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('classPanel').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('namePanel').classList.add('active');
            }
        }

        function autoSearch() {
            // 학년이나 반을 선택하면 자동으로 검색 실행 (편의성)
            performSearch();
        }

        function initMonthSelect() {
            const monthSelect = document.getElementById('monthSelect');
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1; // 1-12

            let startYear;
            if (currentMonth >= 3) {
                startYear = currentYear;
            } else {
                startYear = currentYear - 1;
            }

            // 3월부터 다음해 2월까지 12개월 생성
            for (let i = 0; i < 12; i++) {
                let y = startYear;
                let m = 3 + i;
                if (m > 12) {
                    y++;
                    m -= 12;
                }

                const opt = document.createElement('option');
                const val = `${y}-${String(m).padStart(2, '0')}`;
                opt.value = val;
                opt.textContent = `${y}년 ${m}월`;

                // 현재 날짜와 일치하면 기본 선택 (단, 학년도 범위 내일 때만)
                if (y === currentYear && m === currentMonth) {
                    opt.selected = true;
                }

                monthSelect.appendChild(opt);
            }
        }

        let holidayList = [];

        // 페이지 로드 시 실행
        window.onload = function () {
            // [추가] 앱 설정 로드 및 드롭다운 초기화
            google.script.run.withSuccessHandler(function (settings) {
                const elements = {
                    grade: [document.getElementById('gradeSelect'), document.getElementById('editGrade')],
                    classNum: [document.getElementById('classSelect'), document.getElementById('editClass')],
                    number: [document.getElementById('numberSelect'), document.getElementById('editNumber')]
                };

                // 학년 초기화
                elements.grade.forEach((sel, idx) => {
                    if (idx === 0) { // 검색용 필터 (전체 옵션 포함)
                        if (settings.targetGrade && settings.targetGrade !== 0) {
                            sel.options.length = 0;
                            sel.add(new Option(settings.targetGrade + "학년", settings.targetGrade));
                        } else {
                            for (let i = 1; i <= settings.maxGrade; i++) {
                                sel.add(new Option(i + "학년", i));
                            }
                        }
                    } else { // 수정용 필터 (고정값 없음)
                        for (let i = 1; i <= settings.maxGrade; i++) {
                            sel.add(new Option(i + "학년", i));
                        }
                    }
                });

                // 반 초기화
                elements.classNum.forEach((sel, idx) => {
                    for (let i = 1; i <= settings.maxClass; i++) {
                        sel.add(new Option(i + "반", i));
                    }
                });

                // 번호 초기화
                elements.number.forEach((sel, idx) => {
                    for (let i = 1; i <= settings.maxNumber; i++) {
                        sel.add(new Option(i + "번", i));
                    }
                });

                // 설정 로드 후 초기 조회 실행 (학년 필터가 적용된 상태에서 조회되도록 함)
                performSearch();
            }).getAppSettings();

            initMonthSelect();

            // 휴일 정보 미리 로드
            google.script.run.withSuccessHandler(function (hl) {
                holidayList = hl;
            }).getHolidays();
        };

        // [핵심] 수정 모달 전용 일수 계산
        function calcEditDays() {
            const sVal = document.getElementById('editStartDate').value;
            const eVal = document.getElementById('editEndDate').value;
            if (!sVal || !eVal) return;

            let start = new Date(sVal);
            let end = new Date(eVal);
            start.setHours(12, 0, 0, 0);
            end.setHours(12, 0, 0, 0);

            if (start > end) {
                document.getElementById('editTotalDays').value = "0일";
                return;
            }

            let count = 0;
            let current = new Date(start);
            while (current <= end) {
                const dStr = current.getFullYear() + "-" +
                    String(current.getMonth() + 1).padStart(2, '0') + "-" +
                    String(current.getDate()).padStart(2, '0');
                const day = current.getDay();
                if (day !== 0 && day !== 6 && !holidayList.includes(dStr)) {
                    count++;
                }
                current.setDate(current.getDate() + 1);
            }
            document.getElementById('editTotalDays').value = count + "일";
        }

        // [핵심] 결석 종류에 따른 서류 목록 동적 생성
        function updateEditUI(savedDocs = []) {
            let type = document.getElementById('editType').value;
            const subTypeContainer = document.getElementById('editSubTypeContainer');

            let subType = "";
            const radios = document.getElementsByName('editSubType');
            for (let r of radios) { if (r.checked) { subType = r.value; break; } }

            let realType = type;
            if (type === "출석인정") {
                subTypeContainer.style.display = "block";
                realType = subType || type; // if subType selected, treat as realType for document options

                const reasonBox = document.getElementById('editReason');
                if (subType === "생리통") {
                    reasonBox.value = "";
                    reasonBox.disabled = true;
                    reasonBox.placeholder = "생리통은 구체적 사유 작성이 필요 없습니다.";
                } else {
                    reasonBox.disabled = false;
                    reasonBox.placeholder = "구체적 사유를 입력하세요";
                }
            } else {
                subTypeContainer.style.display = "none";
                document.getElementById('editReason').disabled = false;
                document.getElementById('editReason').placeholder = "구체적 사유를 입력하세요";
            }

            const docList = document.getElementById('editDocList');

            let options = [];
            if (type === "질병") {
                options = [
                    { label: "의사진단서, 소견서, 진료확인서, 처방전, 약봉투(병명, 진료 기간 등이 기록된 증빙서류)", warning: "" },
                    { label: "담임교사 확인서", warning: "※ 상습적이지 않은 2일 이내 질병 근태의 경우에 한함. 즉, 질병 발생 첫날 의사 진단서, 소견서, 진료확인서, 처방전, 약봉투 제출 시, 익일(2일차)은 담임교사 확인서, 학부모 의견서 중 하나로 갈음할 수 있음." },
                    { label: "학부모 의견서", warning: "※ 상습적이지 않은 2일 이내 질병 근태의 경우에 한함. 즉, 질병 발생 첫날 의사 진단서, 소견서, 진료확인서, 처방전, 약봉투 제출 시, 익일(2일차)은 담임교사 확인서, 학부모 의견서 중 하나로 갈음할 수 있음." }
                ];
            } else if (realType === "생리통") {
                options = [
                    { label: "의사진단서, 소견서, 진료확인서 (※ 시험 기간 질병 처리 필수 서류임.)", warning: "" }
                ];
            } else if (type === "출석인정") {
                if (realType === "대입 관련") {
                    options = [
                        { label: "대입 관련 증빙 서류", warning: "", isEtc: true }
                    ];
                } else if (realType === "기타") {
                    options = [
                        { label: "기타 증빙 서류", warning: "", isEtc: true }
                    ];
                } else {
                    options = [
                        { label: "의사진단서, 소견서(질병명, 날짜, 인적사항 포함)", warning: "" },
                        { label: "경조사 등(학생과 경조사의 인과관계를 입증할 수 있는 서류 등)", warning: "" }
                    ];
                }
            } else {
                options = [
                    { label: "기타 증빙 서류", warning: "", isEtc: true }
                ];
            }

            let html = `<table class="edit-doc-table">
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">선택</th>
                        <th>증빙 서류 명칭</th>
                    </tr>
                </thead>
                <tbody>`;

            html += options.map((opt, i) => {
                const item = opt.label;
                const cleanDocs = savedDocs.filter(Boolean);

                const isChecked = cleanDocs.some(d => {
                    if (opt.isEtc) {
                        return d.startsWith("기타 증빙 서류") ||
                            d.startsWith("대입 관련 증빙 서류") ||
                            d.includes("기타 증빙 서류") ||
                            d.includes("대입 관련 증빙 서류");
                    }

                    // 핵심 키워드로 교차 검증 (사용자가 대장 텍스트를 마음대로 줄이는 경우 완벽 대비)
                    if (item.includes("의사진단서") && (d.includes("의사진단서") || d.includes("의견서"))) return true;
                    if (item.includes("처방전") && (d.includes("처방전") || d.includes("진료확인서"))) return true;
                    if (item.includes("담임") && d.includes("담임")) return true;
                    if (item.includes("학부모") && d.includes("학부모")) return true;
                    if (item.includes("경조사") && d.includes("경조사")) return true;

                    return item.includes(d) || d.includes(item);
                });

                const etcMatch = savedDocs.find(d => d && (d.includes("기타 증빙 서류(") || d.includes("대입 관련 증빙 서류(")));
                const etcDetail = etcMatch ? etcMatch.match(/\(([^)]+)\)/)[1] : "";

                return `
                    <tr>
                        <td style="text-align: center; vertical-align: top; padding-top:12px;">
                            <input type="checkbox" name="editDoc" value="${item}" ${isChecked ? 'checked' : ''} onchange="toggleEditEtc(this)">
                        </td>
                        <td>
                            <div style="display: flex; flex-direction: column; gap: 4px; width:100%; height:100%;">
                                <div style="display:flex; align-items:center;">
                                    <span style="color: #333; font-weight: bold;">${item}</span>
                                    ${opt.isEtc ? `
                                        <input type="text" id="editEtcDetail" 
                                            style="display:${isChecked ? 'inline-block' : 'none'}; 
                                            flex: 1; border: 1px solid #4A86E8; border-radius: 4px; 
                                            padding: 6px 10px; font-size: 13px; margin-left:10px;" 
                                            placeholder="상세 서류명" value="${etcDetail}">
                                    ` : ''}
                                </div>
                                ${opt.warning ? `<div style="color:#d93025; font-size:12px; word-break:keep-all;">${opt.warning}</div>` : ''}
                            </div>
                        </td>
                    </tr>`;
            }).join("");

            html += `</tbody></table>`;
            docList.innerHTML = html;
        }

        function toggleEditEtc(cb) {
            const etcInput = document.getElementById('editEtcDetail');
            if (etcInput && (cb.value === "기타 증빙 서류" || cb.value === "대입 관련 증빙 서류")) {
                etcInput.style.display = cb.checked ? "inline-block" : "none";
            }
        }

        function toggleEditMOtherInput(cb) {
            const div = document.getElementById('editMOtherInputDiv');
            if (div) {
                div.style.display = cb.checked ? "block" : "none";
                if (!cb.checked) document.getElementById('edit_m_other_text').value = "";
            }
        }

        function performSearch() {
            const loader = document.getElementById('loading');
            const area = document.getElementById('resultArea');
            const month = document.getElementById('monthSelect').value;

            area.innerHTML = "";
            loader.style.display = "flex";

            let query;
            if (currentMode === 'class') {
                query = {
                    grade: document.getElementById('gradeSelect').value,
                    classNum: document.getElementById('classSelect').value,
                    number: document.getElementById('numberSelect').value,
                    month: month
                };
            } else {
                const name = document.getElementById('nameInput').value.trim();
                if (!name && !month) {
                    alert("이름을 입력하거나 월을 선택해주세요.");
                    loader.style.display = "none";
                    area.innerHTML = '<div class="no-result">검색어를 입력해주세요.</div>';
                    return;
                }
                query = {
                    name: name,
                    month: month
                };
            }

            console.log("검색 실행:", query);

            google.script.run
                .withSuccessHandler(function (results) {
                    console.log("검색 결과 수신:", results);
                    loader.style.display = "none";

                    if (!results) {
                        area.innerHTML = '<div class="no-result" style="color:red">서버로부터 응답이 없습니다.</div>';
                        return;
                    }

                    if (results.error) {
                        area.innerHTML = `<div class="no-result" style="color:red">서버 오류: ${results.error}</div>`;
                        return;
                    }

                    if (!Array.isArray(results) || results.length === 0) {
                        area.innerHTML = '<div class="no-result">검색 결과가 없습니다.</div>';
                        return;
                    }

                    let html = `<table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                <th>학년-반-번호</th>
                <th>성명</th>
                <th>구분</th>
                <th>종류</th>
                <th>시작일</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody>`;

                    results.forEach(row => {
                        const studentIdLabel = `${row.grade}학년 ${row.class}반 ${row.number}번`;
                        html += `<tr>
              <td style="text-align: center;"><input type="checkbox" class="row-checkbox" data-no="${row.no}" data-pdf="${row.pdfUrl || ''}" data-name="${row.name}"></td>
              <td>${row.grade}-${row.class}-${row.number}</td>
              <td title="${studentIdLabel}"><strong>${row.name}</strong></td>
              <td>${row.cat}</td>
              <td>${row.type}</td>
              <td>${row.startDate}</td>
              <td class="action-cell">
                ${row.pdfUrl
                                ? `<button class="btn-view" onclick="previewPDF('${row.pdfUrl}', '${row.name}')">미리보기</button>
                     <button class="btn-print" onclick="window.open('${row.pdfUrl.replace('/preview', '/view')}', '_blank')">출력</button>`
                                : '<span class="txt-nopdf">PDF 없음</span>'}
                <button class="btn-print" style="background:#3498db" onclick="openEditModal('${row.no}')">수정</button>
                <button class="btn-recreate" onclick="recreatePDF('${row.no}', '${row.name}')">재생성</button>
                <button class="btn-print" style="background:#e74c3c" onclick="deleteRecord('${row.no}', '${row.name}')">삭제</button>
              </td>
            </tr>`;
                    });

                    html += '</tbody></table>';
                    area.innerHTML = html;
                })
                .withFailureHandler(function (err) {
                    console.error("통신 오류:", err);
                    loader.style.display = "none";
                    area.innerHTML = `<div class="no-result" style="color:red">통신 오류가 발생했습니다: ${err.toString()}</div>`;
                })
                .searchRecords(query);
        }

        function previewPDF(url, name) {
            document.getElementById('modalTitle').innerText = `📄 ${name} 학생 결석계 미리보기`;
            document.getElementById('pdfFrame').src = url;

            // 다운로드 링크 설정 (UC 익스포트 URL 활용)
            const fileId = url.match(/[-\w]{25,}/);
            if (fileId) {
                document.getElementById('pdfDownloadBtn').href = `https://docs.google.com/uc?export=download&id=${fileId[0]}`;
                document.getElementById('pdfDownloadBtn').style.display = "inline-block";
            } else {
                document.getElementById('pdfDownloadBtn').style.display = "none";
            }

            document.getElementById('pdfModal').style.display = "block";
            document.body.classList.add('modal-open');
        }

        function closeModal() {
            document.getElementById('pdfModal').style.display = "none";
            document.getElementById('pdfFrame').src = "";
            document.getElementById('pdfDownloadBtn').href = "#";
            document.body.classList.remove('modal-open');
        }

        function recreatePDF(no, name) {
            if (!confirm(`${name} 학생의 결석계를 다시 생성하시겠습니까?\n기존 PDF 파일은 삭제됩니다.`)) return;

            const loader = document.getElementById('loading');
            loader.innerText = "PDF 재생성 및 기존 파일 삭제 중...";
            loader.style.display = "flex";

            google.script.run
                .withSuccessHandler(function (res) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    if (res.status === "success") {
                        alert("성공적으로 재생성되었습니다.");
                        performSearch(); // 목록 새로고침
                    } else {
                        alert("재생성 실패: " + res.message);
                    }
                })
                .withFailureHandler(function (err) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    alert("통신 오류: " + err.toString());
                })
                .recreateReportPdf(no);
        }

        function deleteRecord(no, name) {
            // 1차 확인
            if (!confirm(`${name} 학생의 결석계 기록을 삭제하시겠습니까?`)) return;

            // 2차 확인
            if (!confirm(`정말로 삭제하시겠습니까?\n연결된 PDF와 서명 파일이 모두 영구 삭제되며, 이후 관리 번호가 자동으로 재조정됩니다.`)) return;

            const loader = document.getElementById('loading');
            loader.innerText = "기록 및 관련 파일 삭제 중...";
            loader.style.display = "flex";

            google.script.run
                .withSuccessHandler(function (res) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    if (res.status === "success") {
                        alert("성공적으로 삭제되었습니다.");
                        performSearch(); // 목록 새로고침
                    } else {
                        alert("삭제 실패: " + res.message);
                    }
                })
                .withFailureHandler(function (err) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    alert("통신 오류: " + err.toString());
                })
                .deleteReportRecord(no);
        }

        function openEditModal(no) {
            const loader = document.getElementById('loading');
            loader.innerText = "기록 데이터를 가져오는 중...";
            loader.style.display = "flex";

            google.script.run
                .withSuccessHandler(function (data) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    if (data.error) {
                        alert("데이터를 가져오는 데 실패했습니다: " + data.error);
                        return;
                    }

                    // 폼 채우기
                    document.getElementById('editRowNo').value = no;
                    document.getElementById('editGrade').value = data.grade;
                    document.getElementById('editClass').value = data.classNum; // Code.gs에서 classNum으로 반환함
                    document.getElementById('editNumber').value = data.number;
                    document.getElementById('editName').value = data.name;
                    document.getElementById('editCat').value = data.cat;

                    // 기존 데이터 파싱 (출석인정 서브타입용)
                    const radios = document.getElementsByName('editSubType');
                    for (let r of radios) r.checked = false;

                    if (data.type === "생리통") {
                        document.getElementById('editType').value = "출석인정";
                        document.querySelector('input[name="editSubType"][value="생리통"]').checked = true;
                        document.getElementById('editReason').value = data.reason;
                    } else if (data.type === "출석인정") {
                        document.getElementById('editType').value = "출석인정";
                        const subTypeVal = data.subType;
                        if (subTypeVal) {
                            const radio = document.querySelector(`input[name="editSubType"][value="${subTypeVal}"]`);
                            if (radio) radio.checked = true;
                        }

                        // 구체적 사유 복원 (기존 괄호 접두어 데이터 파싱 대응)
                        const reasonStr = data.reason || "";
                        const match = reasonStr.match(/^(경조사|전염병|기타)(?:\((.*)\)?)?$/);
                        if (match) {
                            let extractedReason = match[2] || "";
                            if (extractedReason.endsWith(")")) {
                                extractedReason = extractedReason.slice(0, -1);
                            }
                            document.getElementById('editReason').value = extractedReason;
                        } else {
                            document.getElementById('editReason').value = data.reason;
                        }
                    } else {
                        document.getElementById('editType').value = data.type;
                        document.getElementById('editReason').value = data.reason;
                    }

                    document.getElementById('editStartDate').value = data.startDate;
                    document.getElementById('editStartPeriod').value = data.startPeriod || "1";
                    document.getElementById('editEndDate').value = data.endDate;
                    document.getElementById('editEndPeriod').value = data.endPeriod || "1";
                    document.getElementById('editTotalDays').value = data.totalDays || "0일";
                    document.getElementById('editWriteDate').value = data.writeDate || "";
                    document.getElementById('editTeacherName').value = data.teacherName || "";
                    document.getElementById('editTeacherDate').value = data.teacherDate || "";

                    // 교사 확인란 데이터 채우기
                    document.getElementById('editConfirmDate').value = data.confirmDate || "";
                    document.getElementById('edit_m_visit').checked = !!data.m_visit;
                    document.getElementById('edit_m_phone').checked = !!data.m_phone;
                    document.getElementById('edit_m_school').checked = !!data.m_school;
                    document.getElementById('edit_m_other').checked = !!data.m_other;
                    document.getElementById('edit_m_other_text').value = data.m_other_text || "";
                    document.getElementById('editMOtherInputDiv').style.display = data.m_other ? "block" : "none";

                    // 서류 목록 초기화 및 체크 처리
                    const savedDocs = [data.doc1, data.doc2, data.doc3].filter(d => d);
                    updateEditUI(savedDocs);

                    document.getElementById('editModal').style.display = "flex";
                    document.body.classList.add('modal-open');
                })
                .withFailureHandler(function (err) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    alert("통신 오류: " + err.toString());
                })
                .getRecordDetail(no);
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = "none";
            document.getElementById('editForm').reset();
            document.body.classList.remove('modal-open');
        }

        function saveEdit() {
            const form = document.getElementById('editForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // --- 타입 포맷 변경 패치 (index.html과 동일한 로직) ---
            if (data.type === "출석인정") {
                if (!data.editSubType) {
                    alert("출석인정 세부 사유(생리통, 경조사 등)를 선택해주세요.");
                    return;
                }

                if (data.editSubType === "생리통") {
                    data.type = "생리통";
                    data.reason = "생리통";
                } else {
                    const typedReason = data.reason || "";
                    if (!typedReason.trim()) {
                        alert("출석인정에 대한 구체적 사유를 작성해주세요.");
                        return;
                    }
                    data.reason = typedReason.trim();
                }
            }
            // -----------------------------------------------------------

            // 체크박스(첨부서류) 데이터 별도 수집
            const docCheckboxes = document.querySelectorAll('input[name="editDoc"]:checked');
            const docs = Array.from(docCheckboxes).map(cb => {
                if (cb.value === "기타 증빙 서류" || cb.value === "대입 관련 증빙 서류") {
                    const detail = document.getElementById('editEtcDetail').value.trim();
                    let docVal = detail ? `${cb.value}(${detail})` : cb.value;
                    if (data.type === "출석인정" && (data.editSubType === "대입 관련" || data.editSubType === "기타")) {
                        docVal = "출석인정 - " + docVal;
                    }
                    return docVal;
                }
                return cb.value;
            });

            // AB~AE(28~31) 열에 대응하도록 doc1~doc4 할당
            data.doc1 = docs[0] || "";
            data.doc2 = docs[1] || "";
            data.doc3 = docs[2] || "";
            data.doc4 = docs[3] || "";

            // 필수 인자 추가
            data.autoRecreate = true;
            data.class = data.class; // 폼 필드 이름이 class임

            // 유효성 검사
            if (!data.grade || !data.class || !data.number || !data.name || !data.startDate || !data.endDate || !data.writeDate) {
                alert("필수 항목(학번, 성명, 날짜, 작성일 등)을 모두 입력해주세요.");
                return;
            }

            if (new Date(data.startDate) > new Date(data.endDate)) {
                alert("시작일은 종료일보다 이전이어야 합니다.");
                return;
            }

            if (!confirm("수정된 내용을 저장하고 PDF를 재생성하시겠습니까?")) return;

            const loader = document.getElementById('loading');
            loader.innerText = "기록 수정 및 PDF 재생성 중...";
            loader.style.display = "flex";

            google.script.run
                .withSuccessHandler(function (res) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    if (res.status === "success" || res.status === "partial") {
                        if (res.status === "partial") {
                            alert("기록은 수정되었으나 PDF 재생성에 실패했습니다:\n" + res.message);
                        } else {
                            alert("성공적으로 수정 및 PDF 재생성이 완료되었습니다.");
                        }
                        closeEditModal();
                        performSearch();
                    } else {
                        alert("수정 실패: " + res.message);
                    }
                })
                .withFailureHandler(function (err) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    alert("통신 오류: " + err.toString());
                })
                .updateReportRecord(data);
        }

        // 모달 외곽 클릭 시 닫기
        window.onclick = function (event) {
            const modal = document.getElementById('pdfModal');
            const editModal = document.getElementById('editModal');
            if (event.target == modal) closeModal();
            if (event.target == editModal) closeEditModal();
        }

        // --- 일괄 작업 관련 함수 ---

        function toggleSelectAll(selectAllCb) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAllCb.checked);
        }

        function getSelectedRows() {
            return Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => ({
                no: cb.getAttribute('data-no'),
                pdf: cb.getAttribute('data-pdf'),
                name: cb.getAttribute('data-name')
            }));
        }

        async function bulkRecreate() {
            const selected = getSelectedRows();
            if (selected.length === 0) {
                alert("재생성할 항목을 선택해주세요.");
                return;
            }

            if (!confirm(`선택한 ${selected.length}개의 결석계를 일괄 재생성하시겠습니까?\n이 작업은 각 파일을 순차적으로 처리하므로 시간이 다소 소요될 수 있습니다.`)) return;

            const loader = document.getElementById('loading');
            loader.style.display = "flex";

            let results = { success: [], fail: [] };

            for (let i = 0; i < selected.length; i++) {
                const item = selected[i];
                loader.innerText = `일괄 재생성 중... (${i + 1}/${selected.length})\n[${item.name}] 처리 중...`;

                try {
                    const res = await new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(resolve)
                            .withFailureHandler(reject)
                            .recreateReportPdf(item.no);
                    });

                    if (res.status === "success") {
                        results.success.push(item.name);
                    } else {
                        results.fail.push(`${item.name} (${res.message})`);
                    }
                } catch (err) {
                    results.fail.push(`${item.name} (통신 오류)`);
                }
            }

            loader.style.display = "none";
            loader.innerText = "조회 중입니다...";

            let msg = `작업이 완료되었습니다.\n- 성공: ${results.success.length}건`;
            if (results.fail.length > 0) {
                msg += `\n- 실패: ${results.fail.length}건\n\n[실패 상세]\n` + results.fail.join('\n');
            }
            alert(msg);
            performSearch();
        }

        function bulkPrint() {
            const selected = getSelectedRows();
            if (selected.length === 0) {
                alert("인쇄할 항목을 선택해주세요.");
                return;
            }

            if (!confirm(`선택한 ${selected.length}개의 결석계를 하나의 PDF로 묶어서 인쇄하시겠습니까?\n(기존 PDF 파일이나 기록은 변경되지 않으며, 인쇄용 통합본만 임시로 생성합니다.)`)) return;

            const loader = document.getElementById('loading');
            loader.innerText = `인쇄용 통합 PDF 생성 중... (총 ${selected.length}건)\n잠시만 기다려 주세요.`;
            loader.style.display = "flex";

            google.script.run
                .withSuccessHandler(function (res) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    if (res.status === "success") {
                        // 생성된 통합 PDF를 미리보기 모달로 띄우기
                        previewPDF(res.pdfUrl, "일괄 인쇄 통합본");
                        // console.log("Merged PDF URL:", res.pdfUrl);
                    } else {
                        alert("통합 PDF 생성 실패: " + res.message);
                    }
                })
                .withFailureHandler(function (err) {
                    loader.style.display = "none";
                    loader.innerText = "조회 중입니다...";
                    alert("통신 오류: " + err.toString());
                })
                .generateMergedPdf(selected.map(item => item.no));
        }
    </script>
